name: acceptance

on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: read

concurrency:
  group: single-acceptance-job-per-repo

jobs:
  integration:
    if: github.event_name == 'pull_request'
    environment: runtime
    permissions:
      # Access to the integration testing infrastructure.
      id-token: write
      # Write test results to the PR.
      pull-requests: write
    runs-on:
      group: larger-runners
      labels: larger
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Setup uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # v7.3.1
        with:
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"

      - name: Setup for JFrog
        uses: ./.github/actions/jfrog-auth

      - name: Run integration tests
        uses: databrickslabs/sandbox/acceptance@3313d06ce86227537b3f37f5974f7eecb2a8e59a  # acceptance/v0.4.4
        with:
          vault_uri: ${{ secrets.VAULT_URI }}
          timeout: 45m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
